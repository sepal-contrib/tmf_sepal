name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  EARTHENGINE_TOKEN: ${{ secrets.EARTHENGINE_TOKEN }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: sepal_environment.yml
          cache-environment: true

      - name: Install test deps
        shell: micromamba-shell {0}
        run: pip install pytest nbmake ipykernel

      - name: Register kernel
        shell: micromamba-shell {0}
        run: |
          PROJ_DIR=$(python -c "import pyproj; print(pyproj.datadir.get_data_dir())" 2>/dev/null || echo "")
          if [ -n "$PROJ_DIR" ]; then
            python -m ipykernel install --user --name=test-kernel --env PROJ_DATA "$PROJ_DIR"
          else
            python -m ipykernel install --user --name=test-kernel
          fi

      - name: Test UI notebook
        shell: micromamba-shell {0}
        run: pytest --nbmake ui.ipynb --nbmake-timeout=600 --nbmake-kernel=test-kernel
